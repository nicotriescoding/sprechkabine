<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PubBrawl Sprechkabine</title>
<!-- Nur für TikTok (@legendarysidequest). Aufnahmen gehen an die Supabase-Funktion "kabine", der Schlüssel steckt im Link (#k=...). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --holz: #17110c; --tresen: #221912; --kante: #3b2d21; --kreide: #f4ebde; --staub: #a89683;
    --bier: #f2b33d; --neon: #ff5b6e; --hopfen: #7bd88f;
    --anzeige: "Jersey 10", "Courier New", monospace;
    --text: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--holz); color: var(--kreide); font: 16px/1.5 var(--text); }
  main { max-width: 760px; margin: 0 auto; padding-block: max(20px, env(safe-area-inset-top)) 120px;
         padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  h1 { font: 44px/1 var(--anzeige); margin: 0; color: var(--bier); }
  .kopf { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .kopf p { margin: 0; color: var(--staub); font-size: 15px; }
  .oben { font: 22px/1 var(--anzeige); letter-spacing: .04em; }
  .box { border: 1px dashed var(--kante); border-radius: 10px; padding: 12px 14px; color: var(--staub); }
  .fehler { color: var(--neon); }
  .folge { border-top: 2px solid var(--kante); padding-top: 14px; margin-top: 22px; }
  .folge-kopf { display: flex; align-items: baseline; gap: 12px; }
  .folge-kopf h2 { font: 30px/1.05 var(--anzeige); margin: 0; flex: 1; min-width: 0; }
  .stand { font: 20px/1 var(--anzeige); color: var(--staub); font-variant-numeric: tabular-nums; }
  .striche { display: flex; gap: 4px; margin: 10px 0 6px; }
  .striche i { flex: 1; height: 6px; border-radius: 2px; background: var(--kante); }
  .striche i.ok { background: var(--hopfen); } .striche i.neu { background: var(--bier); }
  .satz { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; padding: 12px 10px; border-radius: 10px;
          border: 1px solid transparent; cursor: pointer; }
  .satz.aktiv { background: var(--tresen); border-color: var(--bier); cursor: default; }
  .nr { font: 22px/1.2 var(--anzeige); color: var(--staub); }
  .inhalt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .text { font-size: 18px; }
  .satz.aktiv .text { font-size: 27px; line-height: 1.3; font-weight: 700; }
  .bild { color: var(--staub); font-size: 13px; }
  .chip { align-self: flex-start; font-size: 12px; padding: 1px 9px; border-radius: 99px; border: 1px solid; }
  .chip.fehlt { color: var(--neon); } .chip.neu { color: var(--bier); } .chip.ok { color: var(--hopfen); }
  .steuer { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .steuer audio { width: 100%; }
  .knopf { font: 700 18px/1 var(--text); padding: 16px 18px; border-radius: 12px; border: 1px solid var(--kante);
           background: var(--tresen); color: var(--kreide); cursor: pointer; flex: 1 1 140px; text-align: center; text-decoration: none; }
  .knopf:disabled { opacity: .45; cursor: not-allowed; }
  .knopf.rec { background: var(--neon); border-color: var(--neon); color: var(--holz); }
  .knopf.rec.laeuft { animation: puls 1s infinite; }
  .knopf.gut { background: var(--hopfen); border-color: var(--hopfen); color: var(--holz); }
  .knopf.zapf { background: var(--bier); border-color: var(--bier); color: var(--holz); flex: 0 1 auto; }
  .pegel { flex-basis: 100%; height: 10px; background: var(--kante); border-radius: 5px; overflow: hidden; }
  .pegel i { display: block; height: 100%; width: 0; background: var(--hopfen); }
  .klein { color: var(--staub); font-size: 13px; flex-basis: 100%; }
  .bauen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; padding: 12px 10px 0; }
  .reiter { display: flex; gap: 8px; margin: 4px 0 8px; }
  .reiter button { flex: 1; font: 24px/1 var(--anzeige); padding: 12px; border-radius: 10px; border: 1px solid var(--kante);
                   background: transparent; color: var(--staub); cursor: pointer; }
  .reiter button.an { background: var(--tresen); border-color: var(--bier); color: var(--bier); }
  .themen { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
  .thema { text-align: left; font: 700 17px/1.25 var(--text); color: var(--kreide); background: var(--tresen); border: 1px solid var(--kante);
           border-radius: 12px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 96px; }
  .thema .zahl { font: 20px/1 var(--anzeige); color: var(--staub); margin-top: auto; }
  .thema .zahl b { color: var(--hopfen); font-weight: 400; }
  .zurueck { background: none; border: 0; color: var(--staub); font: 16px var(--text); padding: 8px 0; cursor: pointer; }
  .thema-kopf h2 { font: 34px/1.05 var(--anzeige); margin: 4px 0 10px; color: var(--bier); }
  .info { background: var(--tresen); border-left: 4px solid var(--bier); border-radius: 8px; padding: 12px 14px; font-size: 16px; }
  details.tipps { margin: 12px 0; }
  details.tipps summary { cursor: pointer; color: var(--staub); padding: 6px 0; }
  .tipp { display: block; width: 100%; text-align: left; font: 16px/1.35 var(--text); color: var(--kreide); background: none;
          border: 1px dashed var(--kante); border-radius: 8px; padding: 10px 12px; margin-top: 6px; cursor: pointer; }
  .tipp.an { border-style: solid; border-color: var(--bier); }
  .vorlesen { font-size: 26px; line-height: 1.3; font-weight: 700; margin: 12px 0 4px; }
  .wer { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
  .wer input { flex: 1; min-width: 0; font: 17px var(--text); padding: 12px; border-radius: 10px; border: 1px solid var(--kante);
               background: var(--tresen); color: var(--kreide); }
  .aufnahme-zone { position: sticky; bottom: 0; background: var(--holz); padding: 10px 0 max(10px, env(safe-area-inset-bottom));
                   display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--kante); margin-top: 8px; z-index: 2; }
  .aufnahme-zone .knopf.rec { font-size: 22px; padding: 22px; flex-basis: 100%; }
  .takes h3 { font: 24px/1 var(--anzeige); margin: 22px 0 6px; color: var(--staub); }
  .take { padding: 10px 0; border-bottom: 1px solid var(--kante); display: flex; flex-direction: column; gap: 6px; }
  .take .meta { color: var(--staub); font-size: 13px; }
  .take audio { width: 100%; }
  .ok-meldung { color: var(--hopfen); font-size: 15px; flex-basis: 100%; }
  @keyframes puls { 50% { opacity: .55; } }
</style>
</head>
<body>
<main>
  <div class="kopf">
    <h1>Sprechkabine</h1>
    <div class="reiter"><button data-reiter="themen">Themen</button><button data-reiter="videos">Videos</button></div>
    <div class="oben" id="oben">Lade…</div>
    <p id="hilfe"></p>
  </div>
  <div id="themen"></div>
  <div id="liste"></div>
</main>
<script>
const API = "https://opqahbmbrvtbsxnxdjvw.supabase.co/functions/v1/kabine";
const WECKER = "https://claude.ai/artifact/D3EGjaLmsKPER7vPcrTU54";
const STATUS = { fehlt: "fehlt", neu: "neu aufnehmen", ok: "fertig" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Schlüssel aus dem Link merken, damit die Seite auch ohne #k=... wieder geht
let K = new URLSearchParams(location.hash.slice(1)).get("k");
try { if (K) localStorage.setItem("kabine_k", K); else K = localStorage.getItem("kabine_k"); } catch (e) {}
if (location.hash) history.replaceState(null, "", location.pathname);

let tippsAuf = false, reiter = "themen", themen = [], takes = {}, thema = null, tipp = null, zuletzt = "";
try { reiter = localStorage.getItem("kabine_reiter") || "themen"; thema = localStorage.getItem("kabine_thema"); } catch (e) {}
let WER = ""; try { WER = localStorage.getItem("kabine_wer") || ""; } catch (e) {}
let folgen = [], aufnahmen = {}, auftraege = {}, aktiv = null, probe = null, beschaeftigt = "";
let rec = null, stream = null, stuecke = [], pegelTimer = null;
const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";

function hash(t) { let h = 5381; for (const c of String(t).trim()) h = (h * 33 + c.codePointAt(0)) >>> 0; return h.toString(36); }
function statusVon(f, s) {
  const a = aufnahmen[f.id + "|" + s.id];
  if (a) return a.hash === hash(s.text) ? "ok" : "neu";
  if (s.neu) return "neu";
  return s.vorhanden ? "ok" : "fehlt";
}
const fertig = f => f.saetze.length > 0 && f.saetze.every(s => statusVon(f, s) === "ok");

async function laden() {
  if (!K) { document.getElementById("oben").textContent = "Link ohne Schlüssel"; document.getElementById("themen").innerHTML = document.getElementById("liste").innerHTML = '<p class="box fehler">Bitte den Link aus dem Projekt öffnen, der Schlüssel fehlt.</p>'; return; }
  try {
    const r = await fetch(`${API}?k=${encodeURIComponent(K)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.fehler || r.status);
    themen = d.folgen.filter(f => f.art === "thema").sort((a, b) => (a.rang ?? 0) - (b.rang ?? 0));
    const tIds = new Set(themen.map(t => t.id));
    folgen = d.folgen.filter(f => f.art !== "thema"); aufnahmen = {}; auftraege = {}; takes = {};
    d.aufnahmen.forEach(a => tIds.has(a.folge) ? (takes[a.folge] ||= []).push(a) : aufnahmen[a.folge + "|" + a.satz] = a);
    Object.values(takes).forEach(l => l.sort((a, b) => String(b.at).localeCompare(String(a.at))));
    d.auftraege.forEach(a => auftraege[a.folge] = a);
    zeichnen();
  } catch (e) {
    document.getElementById("themen").innerHTML = document.getElementById("liste").innerHTML = `<p class="box fehler">Konnte die Folgen nicht laden: ${esc(e.message)}. Internet an?</p>`;
  }
}

function zeichnen() {
  document.querySelectorAll("[data-reiter]").forEach(b => b.classList.toggle("an", b.dataset.reiter === reiter));
  document.getElementById("themen").hidden = reiter !== "themen";
  document.getElementById("liste").hidden = reiter !== "videos";
  if (reiter === "themen") return themenZeichnen();
  document.getElementById("hilfe").textContent = "Satz antippen, „Aufnehmen“, Satz ablesen, „Stopp“. Anhören und behalten. Sind alle Sätze da, „Video bauen“.";
  const offen = folgen.reduce((n, f) => n + f.saetze.filter(s => statusVon(f, s) !== "ok").length, 0);
  document.getElementById("oben").textContent = folgen.length ? (offen ? `${offen} Sätze offen` : "Alles eingesprochen. Prost!") : "Noch keine Folge";
  folgen.sort((a, b) => fertig(a) - fertig(b) || a.id.localeCompare(b.id));
  document.getElementById("liste").innerHTML = folgen.map(f => {
    const st = f.saetze.map(s => statusVon(f, s)), n = st.filter(x => x === "ok").length, job = auftraege[f.id] || {};
    let info = fertig(f) ? "" : `<span class="klein">Noch ${f.saetze.length - n} von ${f.saetze.length} Sätzen offen.</span>`;
    if (job.status === "bestellt") info = `<span class="klein">Bestellt. Tipp auf „Claude Bescheid sagen“, dann baut Claude das Video.</span><a class="knopf" href="${WECKER}" target="_blank" rel="noopener">Claude Bescheid sagen</a>`;
    if (job.status === "läuft") info = '<span class="klein">Claude schneidet gerade das Video…</span>';
    if (job.status === "fehler") info = `<span class="klein fehler">Fehler: ${esc(job.meldung || "unbekannt")}</span>`;
    if (job.status === "fertig") info = '<span class="klein">Video ist fertig.</span>';
    const video = job.video ? `<a class="knopf" href="${esc(job.video)}" target="_blank" rel="noopener">Video ansehen</a>` : "";
    return `<section class="folge">
      <div class="folge-kopf"><h2>${esc(f.titel)}</h2><span class="stand">${n}/${f.saetze.length}</span></div>
      <div class="striche">${st.map(x => `<i class="${x}"></i>`).join("")}</div>
      ${f.saetze.map((s, i) => satzHtml(f, s, st[i])).join("")}
      <div class="bauen"><button class="knopf zapf" data-bauen="${esc(f.id)}" ${fertig(f) && job.status !== "läuft" ? "" : "disabled"}>${job.video ? "Neu bauen" : "Video bauen"}</button>${info}${video}</div>
    </section>`;
  }).join("");
}

function satzHtml(f, s, st) {
  const ist = aktiv && aktiv.folge === f.id && aktiv.id === s.id, a = aufnahmen[f.id + "|" + s.id];
  let steuer = "";
  if (ist) {
    const laeuft = rec && rec.state === "recording";
    steuer = `<div class="steuer">
      ${probe ? `<audio controls src="${probe.url}"></audio>
        <button class="knopf gut" data-behalten ${beschaeftigt ? "disabled" : ""}>${beschaeftigt || "Behalten"}</button>
        <button class="knopf" data-nochmal ${beschaeftigt ? "disabled" : ""}>Nochmal</button>`
      : `<button class="knopf rec ${laeuft ? "laeuft" : ""}" data-rec>${laeuft ? "■ Stopp" : "● Aufnehmen"}</button>
        ${laeuft ? '<span class="pegel"><i id="pegel"></i></span>' : ""}
        ${a && !laeuft ? `<audio controls preload="none" src="${API}?k=${encodeURIComponent(K)}&aktion=ton&folge=${encodeURIComponent(f.id)}&satz=${encodeURIComponent(s.id)}&t=${encodeURIComponent(a.at)}"></audio>` : ""}`}
    </div>`;
  }
  return `<div class="satz ${ist ? "aktiv" : ""}" data-satz="${esc(f.id)}|${esc(s.id)}">
    <span class="nr">${esc(s.id)}</span>
    <div class="inhalt"><div class="text">${esc(s.text)}</div>
      ${s.bild ? `<div class="bild">${esc(s.name ? s.name + " · " : "")}${esc(s.bild)}</div>` : ""}
      <span class="chip ${st}">${s.vorhanden && !a && st === "ok" ? "fertig (am Mac)" : STATUS[st]}</span></div>
    ${steuer}</div>`;
}

function waehlen(folge, id) {
  if (rec && rec.state === "recording") return;
  verwerfen(); aktiv = { folge, id }; zeichnen();
  document.querySelector(".satz.aktiv")?.scrollIntoView({ block: "center", behavior: "smooth" });
}
function naechster(folge) {
  const f = folgen.find(x => x.id === folge), s = f && f.saetze.find(x => statusVon(f, x) !== "ok");
  if (s) waehlen(folge, s.id); else { aktiv = null; zeichnen(); }
}
function verwerfen() { if (probe) URL.revokeObjectURL(probe.url); probe = null; }

async function start() {
  if (!stream) {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
    catch (e) { return fehler("Kein Mikrofon-Zugriff. Bitte im Browser erlauben (Safari: aA-Menü → Website-Einstellungen → Mikrofon)."); }
    const ctx = new (window.AudioContext || window.webkitAudioContext)(), an = ctx.createAnalyser(); an.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    pegelTimer = setInterval(() => {
      an.getByteTimeDomainData(buf); let max = 0; for (const v of buf) max = Math.max(max, Math.abs(v - 128));
      const p = document.getElementById("pegel"); if (p) { p.style.width = Math.min(100, max / 1.28) + "%"; p.style.background = max > 120 ? "var(--neon)" : "var(--hopfen)"; }
    }, 60);
  }
  verwerfen(); stuecke = []; zuletzt = "";
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  rec.ondataavailable = e => e.data.size && stuecke.push(e.data);
  rec.onstop = () => { const blob = new Blob(stuecke, { type: rec.mimeType || mime }); if (reiter === "themen") return takeSpeichern(blob); probe = { blob, url: URL.createObjectURL(blob) }; zeichnen(); };
  rec.start(); zeichnen();
}

async function behalten() {
  if (!probe) return;
  const { folge, id } = aktiv, f = folgen.find(x => x.id === folge), s = f.saetze.find(x => x.id === id);
  const typ = (probe.blob.type || "audio/webm").split(";")[0], endung = typ.includes("mp4") ? "m4a" : "webm";
  beschaeftigt = "Speichere…"; zeichnen();
  try {
    const r = await fetch(`${API}?k=${encodeURIComponent(K)}&aktion=aufnahme&folge=${encodeURIComponent(folge)}&satz=${encodeURIComponent(id)}&hash=${hash(s.text)}&endung=${endung}`,
                          { method: "POST", headers: { "Content-Type": typ }, body: probe.blob });
    const d = await r.json();
    if (!r.ok) throw new Error(d.fehler || r.status);
    aufnahmen[folge + "|" + id] = { folge, satz: id, hash: hash(s.text), at: new Date().toISOString() };
    beschaeftigt = ""; verwerfen(); naechster(folge);
  } catch (e) { beschaeftigt = ""; zeichnen(); fehler("Speichern hat nicht geklappt: " + e.message + ". Nochmal „Behalten“ tippen."); }
}

async function bauen(folge) {
  try {
    const r = await fetch(`${API}?k=${encodeURIComponent(K)}&aktion=bauen&folge=${encodeURIComponent(folge)}`, { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).fehler);
    auftraege[folge] = { ...(auftraege[folge] || {}), status: "bestellt" }; zeichnen();
  } catch (e) { fehler("Bestellen hat nicht geklappt: " + e.message); }
}

// ---------- Themen: beliebig viele Aufnahmen pro Thema ----------
const zeit = t => { try { return new Date(t).toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const tonUrl = (folge, a) => `${API}?k=${encodeURIComponent(K)}&aktion=ton&folge=${encodeURIComponent(folge)}&satz=${encodeURIComponent(a.satz)}&t=${encodeURIComponent(a.at)}`;
const werVon = a => String(a.hash || "").startsWith("wer:") ? a.hash.slice(4) : "";

function themenZeichnen() {
  const el = document.getElementById("themen"), t = themen.find(x => x.id === thema);
  const gesamt = themen.reduce((n, x) => n + (takes[x.id] || []).length, 0);
  if (!t) {
    document.getElementById("oben").textContent = themen.length ? `${gesamt} Aufnahme${gesamt === 1 ? "" : "n"} bisher` : "Noch keine Themen";
    document.getElementById("hilfe").textContent = "Thema antippen und so viele Sprüche einsprechen, wie euch einfallen. Die besten suchen wir später aus.";
    el.innerHTML = `<div class="themen">${themen.map(x => { const n = (takes[x.id] || []).length;
      return `<button class="thema" data-thema="${esc(x.id)}">${esc(x.titel)}<span class="zahl">${n ? `<b>${n}</b> Aufnahme${n === 1 ? "" : "n"}` : "noch leer"}</span></button>`; }).join("")}</div>`;
    return;
  }
  const liste = takes[t.id] || [], laeuft = rec && rec.state === "recording", tipps = t.saetze || [];
  document.getElementById("oben").textContent = `${liste.length} Aufnahme${liste.length === 1 ? "" : "n"} in diesem Thema`;
  document.getElementById("hilfe").textContent = "";
  el.innerHTML = `<div class="thema-kopf"><button class="zurueck" data-zurueck>← Alle Themen</button><h2>${esc(t.titel)}</h2></div>
    ${t.info ? `<div class="info">${esc(t.info)}</div>` : ""}
    ${tipps.length ? `<details class="tipps" ${tippsAuf ? "open" : ""}><summary>Vorschläge zum Anfangen (${tipps.length})</summary>
      ${tipps.map(v => `<button class="tipp ${tipp === v.id ? "an" : ""}" data-tipp="${esc(v.id)}">${esc(v.text)}</button>`).join("")}</details>` : ""}
    <label class="wer"><span class="klein" style="flex:0 0 auto">Wer spricht?</span><input id="wer" maxlength="30" placeholder="Name (optional)" value="${esc(WER)}"></label>
    <div class="aufnahme-zone">
      ${tipp ? `<div class="vorlesen" style="flex-basis:100%">${esc((tipps.find(v => v.id === tipp) || {}).text || "")}</div>` : ""}
      <button class="knopf rec ${laeuft ? "laeuft" : ""}" data-rec ${beschaeftigt ? "disabled" : ""}>${beschaeftigt || (laeuft ? "■ Stopp und speichern" : "● Aufnehmen")}</button>
      ${laeuft ? '<span class="pegel"><i id="pegel"></i></span>' : ""}
      ${zuletzt && !laeuft && !beschaeftigt ? `<span class="ok-meldung">${esc(zuletzt)}</span>` : ""}
    </div>
    <div class="takes"><h3>Aufnahmen (${liste.length})</h3>
      ${liste.length ? liste.map((a, i) => `<div class="take"><span class="meta">#${liste.length - i} · ${esc(werVon(a) || "ohne Name")} · ${esc(zeit(a.at))}</span>
        <audio controls preload="none" src="${tonUrl(t.id, a)}"></audio></div>`).join("") : '<p class="klein">Noch nichts aufgenommen. Einfach loslegen.</p>'}</div>`;
}

function themaWaehlen(id) {
  if (rec && rec.state === "recording") return;
  thema = id; tipp = null; zuletzt = ""; tippsAuf = false;
  try { id ? localStorage.setItem("kabine_thema", id) : localStorage.removeItem("kabine_thema"); } catch (e) {}
  zeichnen(); window.scrollTo(0, 0);
}

async function takeSpeichern(blob) {
  const folge = thema, satz = "n" + Date.now().toString(36);
  const typ = (blob.type || "audio/webm").split(";")[0], endung = typ.includes("mp4") ? "m4a" : "webm";
  const wer = WER.trim().slice(0, 30), hashWert = wer ? "wer:" + wer : "";
  beschaeftigt = "Speichere…"; zeichnen();
  for (let versuch = 0; versuch < 3; versuch++) {
    try {
      const r = await fetch(`${API}?k=${encodeURIComponent(K)}&aktion=aufnahme&folge=${encodeURIComponent(folge)}&satz=${satz}&hash=${encodeURIComponent(hashWert)}&endung=${endung}`,
                            { method: "POST", headers: { "Content-Type": typ }, body: blob });
      const d = await r.json();
      if (!r.ok) throw new Error(d.fehler || r.status);
      (takes[folge] ||= []).unshift({ folge, satz, hash: hashWert, typ, at: new Date().toISOString() });
      beschaeftigt = ""; zuletzt = "✓ Gespeichert. Nächster Spruch?"; zeichnen(); return;
    } catch (e) {
      if (versuch === 2) { beschaeftigt = ""; zeichnen(); fehler("Speichern hat nicht geklappt: " + e.message + ". Internet an? Bitte nochmal aufnehmen."); }
      else await new Promise(r => setTimeout(r, 1500));
    }
  }
}

function fehler(t) {
  const p = document.createElement("p"); p.className = "box fehler"; p.textContent = t;
  (document.querySelector(reiter === "themen" ? ".aufnahme-zone" : ".satz.aktiv .steuer") || document.querySelector(".kopf")).append(p);
  setTimeout(() => p.remove(), 9000);
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-rec]")) return rec && rec.state === "recording" ? rec.stop() : start();
  if (t.closest("[data-behalten]")) return behalten();
  if (t.closest("[data-nochmal]")) { verwerfen(); return start(); }
  const rt = t.closest("[data-reiter]");
  if (rt) { if (rec && rec.state === "recording") return; reiter = rt.dataset.reiter; try { localStorage.setItem("kabine_reiter", reiter); } catch (e) {} verwerfen(); aktiv = null; return zeichnen(); }
  const th = t.closest("[data-thema]"); if (th) return themaWaehlen(th.dataset.thema);
  if (t.closest("[data-zurueck]")) return themaWaehlen(null);
  const tp = t.closest("[data-tipp]"); if (tp) { tipp = tipp === tp.dataset.tipp ? null : tp.dataset.tipp; return zeichnen(); }
  const b = t.closest("[data-bauen]"); if (b) return bauen(b.dataset.bauen);
  if (t.closest("audio, button, a")) return;
  const s = t.closest("[data-satz]");
  if (s && !s.classList.contains("aktiv")) { const [f, id] = s.dataset.satz.split("|"); waehlen(f, id); }
});
document.addEventListener("toggle", e => { if (e.target.matches?.("details.tipps")) tippsAuf = e.target.open; }, true);
document.addEventListener("input", e => {
  if (e.target.id === "wer") { WER = e.target.value; try { localStorage.setItem("kabine_wer", WER); } catch (er) {} }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (reiter === "themen" && thema && e.code === "Space") { e.preventDefault(); if (!beschaeftigt) rec && rec.state === "recording" ? rec.stop() : start(); return; }
  if (!aktiv) return;
  if (e.code === "Space") { e.preventDefault(); rec && rec.state === "recording" ? rec.stop() : !probe && start(); }
  if (e.code === "Enter" && probe) { e.preventDefault(); behalten(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && !(rec && rec.state === "recording") && !probe) laden(); });
laden();
</script>
